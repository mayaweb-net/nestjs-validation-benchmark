services:
  validation-api:
    build:
      context: .
      args:
        APP: nestjs-validation-benchmark
    container_name: validation-benchmark-api
    environment:
      PORT: 3000
    ports:
      - '3000:3000'
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 1g

  adapter-express:
    build:
      context: .
      args:
        APP: nestjs-adapter-benchmark
    container_name: adapter-benchmark-express
    environment:
      PORT: 3001
      ADAPTER: express
    ports:
      - '3001:3001'
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 1g

  adapter-fastify:
    build:
      context: .
      args:
        APP: nestjs-adapter-benchmark
    container_name: adapter-benchmark-fastify
    environment:
      PORT: 3001
      ADAPTER: fastify
    ports:
      - '3002:3001'
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 1g

  serialization-api:
    build:
      context: .
      args:
        APP: nestjs-serialization-benchmark
    container_name: serialization-benchmark-api
    environment:
      PORT: 3003
      SERIALIZER: ${SERIALIZER:-default}
    ports:
      - '3003:3003'
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 1g

  logger-api:
    build:
      context: .
      args:
        APP: nestjs-logger-benchmark
    container_name: logger-benchmark-api
    environment:
      PORT: 3004
      LOGGER: ${LOGGER:-silent}
    ports:
      - '3004:3004'
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 1g
